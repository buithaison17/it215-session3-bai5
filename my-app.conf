# /etc/nginx/sites-available/my-app.conf
# Server block phục vụ website tĩnh đặt tại /opt/my-app/

server {
    listen 80;
    listen [::]:80;
    server_name _;

    # Thư mục mã nguồn web tĩnh (đã cô lập ra khỏi /var/www)
    root /opt/my-app/html;
    index index.html index.htm;

    # Log riêng của dự án
    access_log /opt/my-app/logs/access.log;
    error_log  /opt/my-app/logs/error.log warn;

    location / {
        try_files $uri $uri/ =404;
    }

    # Không cho truy cập file ẩn (.git, .env, ...)
    location ~ /\. {
        deny all;
    }
}
